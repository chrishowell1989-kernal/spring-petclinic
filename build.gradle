plugins {
  id 'java'
  id 'checkstyle'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.graalvm.buildtools.native' version '1.1.2'
  id 'org.cyclonedx.bom' version '3.2.4'
  id 'io.spring.javaformat' version '0.0.47'
  id "io.spring.nohttp" version "0.0.11"
  id 'com.github.node-gradle.node' version '7.1.0'
}

gradle.startParameter.excludedTaskNames += [ "checkFormatAot", "checkFormatAotTest" ]

group = 'org.springframework.samples'
version = '4.0.0-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

repositories {
  mavenCentral()
}

ext.checkstyleVersion = "12.3.1"
ext.springJavaformatCheckstyleVersion = "0.0.47"

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-jackson'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'javax.cache:cache-api'
  runtimeOnly 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly 'com.github.ben-manes.caffeine:caffeine'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-jackson-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.boot:spring-boot-docker-compose'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-mysql'
  testImplementation 'com.microsoft.playwright:playwright:1.61.0'
  checkstyle "io.spring.javaformat:spring-javaformat-checkstyle:${springJavaformatCheckstyleVersion}"
  checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.named("cyclonedxDirectBom").configure {
  dependsOn("compileJava")
  skipConfigs = [".*[Tt]est.*"]
}

checkstyle {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

checkstyleNohttp {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
  // The plugin's default `source` tree includes node_modules regardless of `exclude`
  // patterns layered on top of it (55k+ files, 344MB — enough to OOM Checkstyle), so
  // the tree is rebuilt here with the frontend's npm-managed dirs excluded from the
  // start. See the mustRunAfter wiring near npmBuild/npmInstall below for the related
  // task-ordering fix.
  source = fileTree(rootDir) {
    exclude '.git/**', '.gradle/**', 'build/**', 'target/**', '.idea/**'
    exclude 'src/main/frontend/node_modules/**', 'src/main/frontend/node/**', 'src/main/frontend/dist/**'
  }
}

tasks.named("formatMain").configure { dependsOn("checkstyleMain") }
tasks.named("formatMain").configure { dependsOn("checkstyleNohttp") }

tasks.named("formatTest").configure { dependsOn("checkstyleTest") }
tasks.named("formatTest").configure { dependsOn("checkstyleNohttp") }

checkstyleAot.enabled = false
checkstyleAotTest.enabled = false

checkFormatAot.enabled = false
checkFormatAotTest.enabled = false

formatAot.enabled = false
formatAotTest.enabled = false

node {
  version = '22.22.0'
  download = true
  nodeProjectDir = file("${project.projectDir}/src/main/frontend")
}

tasks.register('npmTest', com.github.gradle.node.npm.task.NpmTask) {
  dependsOn 'npmInstall'
  args = ['run', 'test']
  inputs.dir('src/main/frontend/src')
  inputs.file('src/main/frontend/package.json')
  inputs.file('src/main/frontend/package-lock.json')
}

tasks.register('npmBuild', com.github.gradle.node.npm.task.NpmTask) {
  dependsOn 'npmTest'
  args = ['run', 'build']
  inputs.dir('src/main/frontend/src')
  inputs.file('src/main/frontend/package.json')
  inputs.file('src/main/frontend/package-lock.json')
  outputs.dir('src/main/frontend/dist')
}

tasks.named('processResources') {
  dependsOn 'npmBuild'
  from('src/main/frontend/dist') {
    into 'static'
  }
}

// Gradle's task-output validation sees checkstyleNohttp's source root overlapping
// npmInstall/npmBuild's declared outputs (node_modules/, dist/) regardless of the
// excludes configured above, and fails the build over the undeclared ordering unless
// it's made explicit here.
tasks.named('checkstyleNohttp') {
  mustRunAfter tasks.named('npmInstall'), tasks.named('npmBuild')
}
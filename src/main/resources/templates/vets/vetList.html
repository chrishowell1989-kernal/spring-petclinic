<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 th:text="#{vets}">Veterinarians</h2>

  <div class="form-group">
    <input type="search" id="vet-search" class="form-control" th:placeholder="#{vetSearchPlaceholder}"
      th:aria-label="#{vetSearchPlaceholder}" autocomplete="off" />
  </div>

  <table id="vets" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{specialties}">Specialties</th>
      </tr>
    </thead>
    <tbody>
      <tr class="vet-row" th:each="vet : ${listVets}">
        <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
        <td>
          <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
            th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
        </td>
      </tr>
      <tr id="vets-no-results" style="display: none;">
        <td colspan="2" th:text="#{noVetsFound}">No vets found</td>
      </tr>
    </tbody>
  </table>
  <div id="vets-pagination" th:if="${totalPages > 1}">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/vets.html?page=__${i}__'}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=1'}" th:title="#{first}"
        class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=__${currentPage - 1}__'}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${currentPage + 1}__'}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${totalPages}__'}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
      const input = document.getElementById('vet-search');
      if (!input) {
        return;
      }
      const rows = Array.prototype.slice.call(document.querySelectorAll('#vets tbody tr.vet-row'));
      const noResults = document.getElementById('vets-no-results');
      const pagination = document.getElementById('vets-pagination');

      function applyFilter() {
        const query = input.value.trim().toLowerCase();
        let visible = 0;
        rows.forEach(function (row) {
          const cell = row.cells && row.cells[0];
          const name = (cell ? cell.textContent : '').trim().toLowerCase();
          const matches = query === '' || name.indexOf(query) !== -1;
          row.style.display = matches ? '' : 'none';
          if (matches) {
            visible++;
          }
        });
        if (noResults) {
          noResults.style.display = visible === 0 ? '' : 'none';
        }
        // Pagination reflects the server-side page and is meaningless while
        // filtering the currently loaded rows, so hide it during an active search.
        if (pagination) {
          pagination.style.display = query === '' ? '' : 'none';
        }
      }

      let debounceTimer;
      input.addEventListener('input', function () {
        window.clearTimeout(debounceTimer);
        debounceTimer = window.setTimeout(applyFilter, 250);
      });
    })();
    /*]]>*/
  </script>
</body>

</html>

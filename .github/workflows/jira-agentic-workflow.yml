# Triggered by a Jira Automation rule when a sprint starts, for every story labelled
# "agentic-workflow". The Jira rule sends a `repository_dispatch` webhook with the issue's
# key/summary/description; Claude Code then implements the story end-to-end on its own branch
# and opens a PR back for human + QA review.
#
# Jira Automation side (configure once, not part of this repo):
#   Trigger:   Sprint started
#   Branch:    Issues in the sprint
#   Condition: Work item field condition — Labels contains "agentic-workflow"
#   Action:    Send web request
#     URL:     https://api.github.com/repos/<owner>/<repo>/dispatches
#     Method:  POST
#     Headers: Authorization: Bearer <PAT with repo + workflow scope>
#              Accept: application/vnd.github+json
#     Body:
#       {
#         "event_type": "jira-agentic-workflow",
#         "client_payload": {
#           "issue_key": "{{issue.key}}",
#           "summary": {{issue.summary.asJsonString}},
#           "description": {{issue.description.asJsonString}},
#           "issue_url": "{{issue.url}}"
#         }
#       }
#     Note: summary/description use Jira's .asJsonString smart value modifier (which supplies
#     its own surrounding quotes — don't add literal quotes around those two). Plain free text
#     from Jira can contain quotes/newlines that break the JSON body before it reaches GitHub;
#     issue_key/issue_url are structurally safe and don't need it.
#
# The "Fetch live issue details from Jira" step below re-fetches the summary and description
# directly from the Jira REST API using only the issue key, and overrides whatever the webhook
# sent, as a second line of defence beyond .asJsonString above. This needs three additional repo
# secrets, which are also required by the "Transition Jira issue to In Progress"/"In Review" steps
# further down:
#   JIRA_BASE_URL   e.g. https://your-domain.atlassian.net
#   JIRA_EMAIL      the Atlassian account email that owns the API token below
#   JIRA_API_TOKEN  created at https://id.atlassian.com/manage-profile/security/api-tokens
# If those secrets aren't set, all three of those steps are skipped: the description-fetch falls
# back to whatever the webhook payload (or manual workflow_dispatch inputs) provided, and the
# issue is simply left in its current status rather than transitioned.
#
# The "Transition Jira issue to In Progress" step runs right after the issue details are fetched,
# before the agent starts work, and moves the issue to whichever available transition has
# "in progress" in the name — purely a status signal for humans watching the board, nothing reads
# it back or depends on it.
#
# The "Transition Jira issue to In Review" step moves the issue to whichever of its available
# transitions has "review" in the name, once the PR is open. That transition is itself the
# trigger for a second Jira Automation rule (see agentic-pr-review.yml's header) that kicks off
# the review workflow — deliberately routed through Jira rather than GitHub's own `pull_request`
# event, since a `repository_dispatch` run doesn't hit the "bot-authored PR requires manual
# approval to run workflows" gate that a `pull_request`-triggered one does.
#
# Security note: issue_key/summary/description/url all originate from Jira content, which is
# effectively untrusted input from GitHub's perspective. Every step below reads these only via
# the job-level `env:` block and consumes them as $VAR inside scripts — never as a direct
# ${{ github.event.client_payload.* }} interpolation inside a run: block — since the latter
# pastes raw text into the generated shell script and lets a crafted issue title/summary break
# out and run arbitrary commands on the runner.

name: Jira agentic workflow

on:
  repository_dispatch:
    types: [jira-agentic-workflow]
  # Lets you re-run or test the same job by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira issue key (e.g. PETC-123)'
        required: true
      summary:
        description: 'Jira issue summary'
        required: true
      description:
        description: 'Jira issue description'
        required: false
        default: ''
      issue_url:
        description: 'Link back to the Jira issue'
        required: false
        default: ''

jobs:
  implement-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
      ISSUE_SUMMARY: ${{ github.event.client_payload.summary || inputs.summary }}
      ISSUE_DESCRIPTION: ${{ github.event.client_payload.description || inputs.description }}
      ISSUE_URL: ${{ github.event.client_payload.issue_url || inputs.issue_url }}
      JIRA_CONFIGURED: ${{ secrets.JIRA_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live issue details from Jira
        if: ${{ env.JIRA_CONFIGURED == 'true' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w '\n%{http_code}' \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Accept: application/json" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}?fields=summary,description&expand=renderedFields")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")

          if [ "$http_code" != "200" ]; then
            echo "::warning::Could not fetch $ISSUE_KEY from Jira (HTTP $http_code) — falling back to the webhook payload's summary/description."
            exit 0
          fi

          summary=$(jq -r '.fields.summary // empty' <<< "$body")
          description_html=$(jq -r '.renderedFields.description // empty' <<< "$body")
          description_text=$(python3 -c 'import html, re, sys; t = re.sub(r"<[^>]+>", "\n", sys.stdin.read()); t = html.unescape(t); print(re.sub(r"\n{3,}", "\n\n", t).strip())' <<< "$description_html")

          if [ -n "$summary" ]; then
            delimiter="ghadelim_$(openssl rand -hex 8)"
            {
              echo "ISSUE_SUMMARY<<$delimiter"
              echo "$summary"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "$description_text" ]; then
            delimiter="ghadelim_$(openssl rand -hex 8)"
            {
              echo "ISSUE_DESCRIPTION<<$delimiter"
              echo "$description_text"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          fi

      - name: Transition Jira issue to In Progress
        if: ${{ env.JIRA_CONFIGURED == 'true' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail

          transitions=$(curl -sS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Accept: application/json" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions")

          transition_id=$(jq -r '.transitions[] | select(.name | test("in progress"; "i")) | .id' <<< "$transitions" | head -n1)

          if [ -z "$transition_id" ]; then
            available=$(jq -r '[.transitions[].name] | join(", ")' <<< "$transitions")
            echo "::warning::No transition matching \"in progress\" found for $ISSUE_KEY — leaving its status as-is. Available transitions: $available"
            exit 0
          fi

          http_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions" \
            -d "{\"transition\": {\"id\": \"${transition_id}\"}}")

          if [ "$http_code" != "204" ]; then
            echo "::warning::Failed to transition $ISSUE_KEY to In Progress (HTTP $http_code) — continuing anyway."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Create working branch
        run: |
          slug=$(echo "$ISSUE_SUMMARY" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          branch_name="agentic/${ISSUE_KEY}-${slug}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch_name"
          echo "BRANCH_NAME=$branch_name" >> "$GITHUB_ENV"

      - name: Run Claude Code agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "You are implementing the Jira story $ISSUE_KEY in this repository as an"
            echo "autonomous developer. Follow CLAUDE.md for all project conventions (build"
            echo "commands, code style, i18n, testing layout)."
            echo ""
            echo "Jira issue: $ISSUE_KEY"
            echo "Link: $ISSUE_URL"
            echo "Summary: $ISSUE_SUMMARY"
            echo "Description:"
            echo "$ISSUE_DESCRIPTION"
            cat <<'PROMPT_EOF'

          Do the following, in order:

          1. Implement the feature/fix described above, following the existing
             package-by-feature structure and conventions documented in CLAUDE.md.
          2. Add automated tests for your change:
             - Unit tests (e.g. @WebMvcTest slice tests for controllers).
             - Integration tests (e.g. against the full Spring context / H2), where the
               change warrants it.
             - Do NOT add or modify anything under src/test/java/**/e2e/ (Playwright
               end-to-end tests) — those are owned by QA and out of scope for this workflow.
          3. Format and validate your change before finishing:
             - ./mvnw spring-javaformat:apply
             - ./mvnw test -Dtest='!*E2ETests' and confirm it passes. Do not run the e2e
               test package — browsers aren't installed in this environment.

          Do not run any git commands (branch/commit/push) yourself — the workflow that
          invoked you handles committing and opening the pull request after you finish.

          If anything above is ambiguous or you get blocked (e.g. build failures you can't
          resolve), stop and clearly explain the blocker as your final response instead of
          guessing or leaving the change half-done.
          PROMPT_EOF
          } > /tmp/claude-prompt.txt

          claude --dangerously-skip-permissions --max-turns 40 --verbose --output-format stream-json \
            -p "$(cat /tmp/claude-prompt.txt)" \
            | tee /tmp/claude-stream.jsonl

          jq -r 'select(.type == "result") | .result' /tmp/claude-stream.jsonl > /tmp/claude-output.txt

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced by Claude — skipping commit/push/PR."
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git add -A
          git commit -m "${ISSUE_KEY}: ${ISSUE_SUMMARY}"
          git push origin "$BRANCH_NAME"
          echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

      - name: Open pull request
        if: ${{ env.HAS_CHANGES == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "$ISSUE_KEY implemented — ready for human review and the review workflow."
            echo ""
            echo "$ISSUE_URL"
            echo ""
            echo "Playwright e2e coverage is intentionally left for QA."
            echo ""
            echo "<details><summary>Acceptance criteria (from the Jira description)</summary>"
            echo ""
            echo "$ISSUE_DESCRIPTION"
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Agent's final notes</summary>"
            echo ""
            echo '```'
            tail -c 4000 /tmp/claude-output.txt
            echo '```'
            echo "</details>"
          } > /tmp/pr-body.txt
          gh pr create \
            --title "[$ISSUE_KEY] $ISSUE_SUMMARY" \
            --body-file /tmp/pr-body.txt \
            --base main \
            --head "$BRANCH_NAME"

      - name: Transition Jira issue to In Review
        if: ${{ env.HAS_CHANGES == 'true' && env.JIRA_CONFIGURED == 'true' }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail

          transitions=$(curl -sS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Accept: application/json" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions")

          transition_id=$(jq -r '.transitions[] | select(.name | test("review"; "i")) | .id' <<< "$transitions" | head -n1)

          if [ -z "$transition_id" ]; then
            available=$(jq -r '[.transitions[].name] | join(", ")' <<< "$transitions")
            echo "::warning::No transition matching \"review\" found for $ISSUE_KEY — leaving its status as-is. Available transitions: $available"
            exit 0
          fi

          http_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions" \
            -d "{\"transition\": {\"id\": \"${transition_id}\"}}")

          if [ "$http_code" != "204" ]; then
            echo "::warning::Failed to transition $ISSUE_KEY (HTTP $http_code) — PR was still opened successfully."
          fi

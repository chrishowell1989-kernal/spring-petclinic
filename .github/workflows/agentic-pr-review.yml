# Runs when jira-agentic-workflow.yml transitions a Jira issue to a "review" status after
# opening its PR (see that workflow's "Transition Jira issue to In Review" step). Claude reviews
# the diff as a senior developer would and leaves a single PR comment with its findings.
#
# Deliberately triggered by Jira (via repository_dispatch) rather than GitHub's own `pull_request`
# event: a `pull_request`-triggered run on a bot-authored PR requires a human to click "Approve
# and run workflows" before it executes at all, whereas repository_dispatch always creates a run
# regardless of who authored the PR. Since the dispatch payload only carries the issue key, not a
# PR number, the "Find the PR for this issue" step below looks up the open PR by matching its
# head branch against agentic/<issue key>-* before reviewing it.
#
# Jira Automation side (configure once, not part of this repo):
#   Trigger:   Issue transitioned
#   To status: whatever "In Review"-equivalent status jira-agentic-workflow.yml's transition
#              step lands on for your project (it picks whichever available transition name
#              contains "review")
#   Condition: Work item field condition — Labels contains "agentic-workflow"
#   Action:    Send web request
#     URL:     https://api.github.com/repos/<owner>/<repo>/dispatches
#     Method:  POST
#     Headers: Authorization: Bearer <PAT with repo + workflow scope>
#              Accept: application/vnd.github+json
#     Body:
#       {
#         "event_type": "jira-review-requested",
#         "client_payload": {
#           "issue_key": "{{issue.key}}"
#         }
#       }
#
# This is deliberately non-blocking: it never calls `gh pr review --approve` or
# `--request-changes`, only `gh pr comment`. A formal --approve wouldn't work here anyway —
# both this workflow and the implementer workflow authenticate as the same github-actions[bot]
# identity via GITHUB_TOKEN, and GitHub rejects a bot approving its own PR. Sign-off here is a
# human clicking Approve on GitHub, which is what triggers agentic-qa-playwright.yml.
#
# Security note: issue key/PR title/body/base-ref are read via job-level env: and consumed as
# $VAR inside scripts, never interpolated directly via ${{ }} in a run: block — same rationale
# as jira-agentic-workflow.yml, since this content ultimately traces back to Jira issue text.

name: Agentic PR review

on:
  repository_dispatch:
    types: [jira-review-requested]
  # Lets you re-run or test the same job by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira issue key whose open PR should be reviewed (e.g. PETC-123)'
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the PR for this issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pr_json=$(gh pr list --state open --json number,title,body,baseRefName,headRefName --limit 100 \
            | jq --arg prefix "agentic/${ISSUE_KEY}-" '[.[] | select(.headRefName | startswith($prefix))]')

          count=$(jq 'length' <<< "$pr_json")
          if [ "$count" -eq 0 ]; then
            echo "::error::No open PR found with a head branch starting agentic/${ISSUE_KEY}-"
            exit 1
          fi

          echo "PR_NUMBER=$(jq -r '.[0].number' <<< "$pr_json")" >> "$GITHUB_ENV"
          echo "BASE_REF=$(jq -r '.[0].baseRefName' <<< "$pr_json")" >> "$GITHUB_ENV"
          echo "HEAD_REF=$(jq -r '.[0].headRefName' <<< "$pr_json")" >> "$GITHUB_ENV"

          delimiter="ghadelim_$(openssl rand -hex 8)"
          {
            echo "PR_TITLE<<$delimiter"
            jq -r '.[0].title' <<< "$pr_json"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
          {
            echo "PR_BODY<<$delimiter"
            jq -r '.[0].body' <<< "$pr_json"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Check out the PR branch
        run: |
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Review the PR with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "You are a senior developer reviewing a colleague's pull request in this"
            echo "repository. Follow CLAUDE.md for the project's conventions when judging"
            echo "the change."
            echo ""
            echo "PR #$PR_NUMBER: $PR_TITLE"
            echo ""
            echo "PR description:"
            echo "$PR_BODY"
            echo ""
            echo "Diff:"
            echo '```diff'
            git diff "origin/${BASE_REF}...HEAD"
            echo '```'
            cat <<'PROMPT_EOF'

          Review this change the way a thoughtful senior developer would: correctness
          bugs, missed edge cases, adherence to CLAUDE.md conventions, test coverage and
          quality, and anything over- or under-engineered for the task. You may read
          other files in the repo for context. Do not modify any files or run any
          commands other than reading files — you are reviewing only.

          This is a low-stakes demo review, not a merge gate, and a human always has
          final sign-off — nobody is blocked by what you write here. Leave nits and
          suggestions freely. If the change looks solid, say so plainly, something like
          "LGTM — waiting on sign-off from a human reviewer", and list any nits below
          that. If you find a genuine correctness problem, call it out clearly, but
          still frame it as input for the human reviewer, not a verdict.

          Respond with plain markdown only — this becomes the PR comment verbatim. Do
          not include a decision keyword or approval status, just the review itself.
          PROMPT_EOF
          } > /tmp/review-prompt.txt

          claude --max-turns 20 --verbose --output-format stream-json \
            -p "$(cat /tmp/review-prompt.txt)" \
            | tee /tmp/review-stream.jsonl

          jq -r 'select(.type == "result") | .result' /tmp/review-stream.jsonl > /tmp/review-output.txt

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file /tmp/review-output.txt
